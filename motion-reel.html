<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOTION — 15s Showreel</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  #progress { position: fixed; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.08); }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, #ff2e63, #ffd23f, #08d9d6, #7b5cff); }
  #hint { position: fixed; right: 18px; bottom: 12px; font: 11px/1 ui-monospace, Menlo, Consolas, monospace;
          color: rgba(255,255,255,.35); letter-spacing: .12em; mix-blend-mode: difference; user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="progress"><div id="bar"></div></div>
<div id="hint">SPACE — ПАУЗА · ←/→ — ПЕРЕМОТКА · КЛИК — С НАЧАЛА</div>
<script>
(() => {
'use strict';

/* ---------- setup ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const bar = document.getElementById('bar');
const DUR = 15;
const TAU = Math.PI * 2;
const FONT = '"Arial Black", "Helvetica Neue", Impact, Arial, sans-serif';
const MONO = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';
const C = { bg: '#07070c', ink: '#0b0b12', pink: '#ff2e63', yel: '#ffd23f', cyan: '#08d9d6', vio: '#7b5cff', wh: '#f4f4f8', paper: '#f1efe9' };
const PAL = [C.pink, C.yel, C.cyan, C.vio];
let W, H, DPR, S, CX, CY, DIAG;

/* ---------- math & easing ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outExpo: p => p === 1 ? 1 : 1 - Math.pow(2, -10 * p),
  inExpo: p => p === 0 ? 0 : Math.pow(2, 10 * p - 10),
  inOutExpo: p => p === 0 ? 0 : p === 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  outBack: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  outElastic: p => p === 0 ? 0 : p === 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * TAU / 3) + 1,
};
let seed = 1;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);

/* ---------- drawing helpers ---------- */
function bg(col) { ctx.fillStyle = col; ctx.fillRect(-60, -60, W + 120, H + 120); }
function circle(x, y, r) { if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function spaced(str, x, y, sp, align = 'center') {
  let w = 0; const ws = [];
  for (const ch of str) { const m = ctx.measureText(ch).width; ws.push(m); w += m + sp; }
  w -= sp;
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const prev = ctx.textAlign; ctx.textAlign = 'left';
  let i = 0;
  for (const ch of str) { ctx.fillText(ch, cx, y); cx += ws[i++] + sp; }
  ctx.textAlign = prev;
  return w;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function shape(type, x, y, s, rot, col, filled) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, s * .22); ctx.lineJoin = 'round';
  ctx.beginPath();
  if (type === 0) ctx.arc(0, 0, s, 0, TAU);
  else if (type === 1) ctx.rect(-s * .85, -s * .85, s * 1.7, s * 1.7);
  else if (type === 2) { for (let k = 0; k < 3; k++) { const a = -Math.PI / 2 + k * TAU / 3; ctx[k ? 'lineTo' : 'moveTo'](Math.cos(a) * s * 1.15, Math.sin(a) * s * 1.15); } ctx.closePath(); }
  else { const w = s * .38; ctx.rect(-s, -w, s * 2, w * 2); ctx.rect(-w, -s, w * 2, s * 2); }
  if (filled || type === 3) ctx.fill(); else { ctx.stroke(); }
  ctx.restore();
}
function label(num, name, t, a, b, col = '#fff') {
  const p = seg(t, a, a + .5), q = seg(t, b - .3, b);
  if (p <= 0 || q >= 1) return;
  const x = 40 * S + 24, y = 64 * S + 34;
  ctx.save();
  ctx.globalAlpha = E.outExpo(p) * (1 - q);
  ctx.fillStyle = col;
  ctx.fillRect(x, y + 14 * S, 60 * S * E.inOutExpo(p) * (1 - E.inExpo(q)), 2 * S);
  ctx.font = `700 ${13 * S + 4}px ${MONO}`; ctx.textBaseline = 'alphabetic';
  spaced(`${num} / ${name}`, x + (1 - E.outExpo(p)) * -30 * S, y, 4 * S, 'left');
  ctx.restore();
}

/* ---------- precomputed assets ---------- */
let P = [], pStep = 4, pFont = 100, vignette, grain;
const N3 = 1100;
const SPH = [], TOR = [], HEL = [];
(function build3D() {
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N3; i++) {
    const y = 1 - (i / (N3 - 1)) * 2, r = Math.sqrt(1 - y * y), th = ga * i;
    SPH.push([Math.cos(th) * r, y, Math.sin(th) * r]);
    const u = (i * 0.61803398875 % 1) * TAU, v = (i / N3) * TAU * 23;
    TOR.push([(1 + .42 * Math.cos(v)) * Math.cos(u), .42 * Math.sin(v), (1 + .42 * Math.cos(v)) * Math.sin(u)]);
    const k = i % 3, tt = Math.floor(i / 3) / (N3 / 3);
    if (k < 2) { const a = tt * TAU * 2.2 + k * Math.PI; HEL.push([Math.cos(a) * .62, (tt - .5) * 2.6, Math.sin(a) * .62]); }
    else { const a = tt * TAU * 2.2, f = (i * 0.3819 % 1) * 2 - 1; HEL.push([Math.cos(a) * .62 * f, (tt - .5) * 2.6, Math.sin(a) * .62 * f]); }
  }
})();
const SPEED = [];
seed = 99;
for (let i = 0; i < 110; i++) SPEED.push({ a: rnd() * TAU, o: rnd(), w: .5 + rnd() * 1.5, c: rnd() < .7 ? '#fff' : PAL[i % 4] });

function buildParticles() {
  const w = Math.max(1, Math.floor(W)), h = Math.max(1, Math.floor(H));
  const oc = document.createElement('canvas'); oc.width = w; oc.height = h;
  const o = oc.getContext('2d');
  pFont = Math.min(w * .19, h * .3);
  o.font = `900 ${pFont}px ${FONT}`; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
  o.fillText('MOTION', w / 2, h / 2);
  const d = o.getImageData(0, 0, w, h).data;
  pStep = Math.max(3, Math.round(pFont / 46));
  const pts = [];
  for (let y = 0; y < h; y += pStep) for (let x = 0; x < w; x += pStep) if (d[(y * w + x) * 4 + 3] > 128) pts.push([x, y]);
  seed = 11;
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  P = pts.slice(0, 2600).map(([x, y]) => ({
    tx: x, ty: y, a: rnd() * TAU, r: (.12 + Math.pow(rnd(), .55)) * Math.max(W, H) * .62,
    c: Math.floor(rnd() * 5), d: rnd(), j: rnd() * TAU,
  }));
}
function buildOverlays() {
  vignette = ctx.createRadialGradient(CX, CY, Math.min(W, H) * .35, CX, CY, DIAG * .62);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,.55)');
  const g = document.createElement('canvas'); g.width = g.height = 220;
  const gx = g.getContext('2d'), id = gx.createImageData(220, 220);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; }
  gx.putImageData(id, 0, 0);
  grain = ctx.createPattern(g, 'repeat');
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; CX = W / 2; CY = H / 2; DIAG = Math.hypot(W, H);
  S = Math.min(W, H) / 900;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  buildParticles(); buildOverlays();
}

/* ---------- SCENE 1 · Big bang → particles assemble "MOTION" (0 – 3.09s) ---------- */
function ppos(q, t) {
  const pe = E.outExpo(seg(t, .6, 1.7));
  const a = q.a + pe * (q.d - .5) * 1.4;
  const ex = CX + Math.cos(a) * q.r * pe, ey = CY + Math.sin(a) * q.r * pe;
  const pg = E.inOutExpo(seg(t, 1.25 + q.d * .42, 2.05 + q.d * .25));
  const jit = Math.sin(t * 4 + q.j) * 1.6 * S * pg;
  return [lerp(ex, q.tx, pg) + jit, lerp(ey, q.ty, pg) + Math.cos(t * 3 + q.j) * 1.6 * S * pg];
}
function scene1(t) {
  bg(C.bg);
  const p0 = seg(t, 0, .55);
  // anticipation: orbiters spiral into a pulsing core
  if (t < .62) {
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 260 * S);
    g.addColorStop(0, `rgba(255,46,99,${.35 * p0})`); g.addColorStop(1, 'rgba(255,46,99,0)');
    ctx.fillStyle = g; circle(CX, CY, 260 * S);
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * TAU + t * 9 + p0 * 4;
      const r = lerp(300 * S, 0, E.inExpo(p0));
      ctx.fillStyle = PAL[i % 4];
      circle(CX + Math.cos(a) * r, CY + Math.sin(a) * r, 6 * S * (1 - p0 * .5));
    }
    ctx.fillStyle = '#fff';
    circle(CX, CY, E.outBack(p0) * 18 * S * (1 + .18 * Math.sin(t * 50)));
  }
  // shockwaves
  for (let i = 0; i < 3; i++) {
    const pr = seg(t, .6 + i * .07, 1.5 + i * .16);
    if (pr <= 0 || pr >= 1) continue;
    ctx.strokeStyle = PAL[i]; ctx.globalAlpha = 1 - pr;
    ctx.lineWidth = (1 - pr) * 34 * S;
    ctx.beginPath(); ctx.arc(CX, CY, E.outExpo(pr) * DIAG * .55, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // particles with motion streaks, batched per colour
  if (t > .6) {
    const cols = [C.pink, C.yel, C.cyan, C.vio, C.wh];
    const gp = E.inOutCubic(seg(t, 1.3, 2.3));
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineWidth = lerp(2.4 * S, pStep * .62, gp);
    for (let c = 0; c < 5; c++) {
      ctx.strokeStyle = cols[c]; ctx.beginPath();
      for (const q of P) {
        if (q.c !== c) continue;
        const [x, y] = ppos(q, t), [px, py] = ppos(q, t - .035);
        // cap streak length so fast frames read as motion blur, not noise
        let vx = x - px, vy = y - py; const len = Math.hypot(vx, vy), max = 34 * S;
        if (len > max) { vx *= max / len; vy *= max / len; }
        ctx.moveTo(x - vx, y - vy);
        if (len < .5) ctx.lineTo(x + .5, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // flash
  const fl = 1 - seg(t, .6, .9);
  if (t > .6 && fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl * .9})`; ctx.fillRect(0, 0, W, H); }
  // solid type with RGB-split glitch
  const ta = seg(t, 2.12, 2.35);
  if (ta > 0) {
    const g = (1 - E.outExpo(seg(t, 2.12, 2.8))) * 26 * S;
    const sc = 1 + E.outCubic(seg(t, 2.1, 3.1)) * .05;
    ctx.save(); ctx.translate(CX, CY); ctx.scale(sc, sc);
    ctx.font = `900 ${pFont}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = ta * .9;
    ctx.fillStyle = '#ff0040'; ctx.fillText('MOTION', -g, Math.sin(t * 60) * g * .3);
    ctx.fillStyle = '#00f0ff'; ctx.fillText('MOTION', g, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = ta * seg(t, 2.25, 2.6);
    ctx.fillStyle = '#fff'; ctx.fillText('MOTION', 0, 0);
    ctx.restore();
    const sp = seg(t, 2.35, 2.85);
    ctx.globalAlpha = E.outCubic(sp);
    ctx.fillStyle = '#fff'; ctx.font = `700 ${12 * S + 5}px ${MONO}`; ctx.textBaseline = 'middle';
    spaced('— MOTION DESIGN SHOWREEL —', CX, CY + pFont * .62, lerp(22, 6, E.outExpo(sp)) * S);
    ctx.globalAlpha = 1;
  }
}

/* ---------- transition · diagonal colour bands ---------- */
function wipe(t) {
  const sk = H * .35;
  for (let i = 0; i < 3; i++) {
    const p = E.inOutExpo(seg(t, 2.6 + i * .07, 3.3 + i * .07));
    if (p <= 0 || p >= 1) continue;
    const L = lerp(-3 * W - sk, 1.3 * W + sk, p);
    ctx.fillStyle = [C.pink, C.yel, C.cyan][i];
    ctx.beginPath(); ctx.moveTo(L + sk, -60); ctx.lineTo(L + 2 * W + sk, -60); ctx.lineTo(L + 2 * W, H + 60); ctx.lineTo(L, H + 60); ctx.fill();
  }
}

/* ---------- SCENE 2 · Kinetic geometry grid (3.09 – 5.2s) ---------- */
function scene2(t) {
  bg('#0c0c14');
  // dot grid
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  const gs = 36 * S + 8, off = ((t - 3) * 40 * S) % gs;
  for (let y = -gs; y < H + gs; y += gs) for (let x = -gs; x < W + gs; x += gs) ctx.fillRect(x + off, y + off, 2, 2);
  // giant outlined marquee
  ctx.save();
  ctx.font = `900 ${H * .42}px ${FONT}`; ctx.textBaseline = 'middle';
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2 * S + .5;
  ctx.strokeText('FORM • FORM • FORM • FORM', -(t - 3) * W * .22, CY);
  ctx.restore();

  const cols = 9, rows = 5, cs = Math.min(W / (cols + 2), H / (rows + 2.4));
  const gx0 = CX - (cols - 1) / 2 * cs, gy0 = CY - (rows - 1) / 2 * cs;
  const maxd = Math.hypot((cols - 1) / 2, (rows - 1) / 2);
  const pc = seg(t, 4.7, 5.2);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const dx = i - (cols - 1) / 2, dy = j - (rows - 1) / 2, d = Math.hypot(dx, dy);
    const ap = E.outBack(seg(t, 3.12 + d * .06, 3.55 + d * .06));
    if (ap <= 0) continue;
    const wave = 1 + .5 * Math.sin((t - 3.5) * 8 - d * 1.15) * seg(t, 3.5, 3.85) * (1 - pc);
    const ce = E.inExpo(seg(t, 4.68 + (maxd - d) * .045, 5.2));
    const flip = E.inOutExpo(seg(t, 3.95 + d * .035, 4.38 + d * .035));
    const x = lerp(gx0 + i * cs, CX, ce), y = lerp(gy0 + j * cs, CY, ce);
    const sz = cs * .3 * ap * wave * (1 - ce * .85);
    const dir = (i + j) % 2 ? 1 : -1;
    const rot = dir * (flip * Math.PI / 2 + (t - 3) * .9) + ce * dir * 4;
    const base = (i + j * 2) % 4;
    const type = (base + (flip > .5 ? 1 : 0)) % 4;
    const col = PAL[(i + j + (flip > .5 ? 1 : 0)) % 4];
    shape(type, x, y, sz, rot, col, ((i + j) % 2 === 0) !== (flip > .5));
  }
  // connecting cross-hair
  const ch = E.inOutExpo(seg(t, 3.3, 3.9)) * (1 - pc);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CX - W * .5 * ch, CY); ctx.lineTo(CX + W * .5 * ch, CY);
  ctx.moveTo(CX, CY - H * .5 * ch); ctx.lineTo(CX, CY + H * .5 * ch); ctx.stroke();
  label('01', 'FORM', t, 3.2, 5.1);
}

/* ---------- SCENE 3 · Kinetic typography + live easing curves (5.2 – 8.16s) ---------- */
const WORDS = [
  { w: 'TIMING', bg: C.pink, fg: C.ink, e: 'outExpo', css: 'cubic-bezier(0.16, 1, 0.3, 1)' },
  { w: 'RHYTHM', bg: C.ink, fg: C.yel, e: 'outElastic', css: 'elastic.out(1, 0.3)' },
  { w: 'EASING', bg: C.cyan, fg: C.ink, e: 'inOutCubic', css: 'cubic-bezier(0.65, 0, 0.35, 1)' },
  { w: 'FLOW', bg: C.vio, fg: '#fff', e: 'outBack', css: 'cubic-bezier(0.34, 1.56, 0.64, 1)' },
];
const S3 = 5.2, WD = .74;
function easeGraph(word, lt) {
  const gs = 120 * S + 30, pad = 40 * S + 24;
  const x0 = W - pad - gs, y0 = H - pad - gs * .3;
  const a = E.outExpo(seg(lt, .05, .3)) * (1 - seg(lt, .62, .74));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = word.fg; ctx.fillStyle = word.fg;
  ctx.globalAlpha = a * .35; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, y0 - gs * .7); ctx.lineTo(x0, y0); ctx.lineTo(x0 + gs, y0); ctx.stroke();
  ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(x0, y0 - gs * .7); ctx.lineTo(x0 + gs, y0 - gs * .7); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = a; ctx.lineWidth = 3 * S + 1; ctx.lineCap = 'round';
  const pr = seg(lt, .06, .55), f = E[word.e];
  ctx.beginPath();
  for (let k = 0; k <= 60; k++) { const u = k / 60 * pr; const px = x0 + u * gs, py = y0 - f(u) * gs * .7; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke();
  circle(x0 + pr * gs, y0 - f(pr) * gs * .7, 6 * S + 2);
  // the same easing driving a slider underneath
  ctx.globalAlpha = a * .3; ctx.fillRect(x0, y0 + 18 * S + 6, gs, 2);
  ctx.globalAlpha = a; circle(x0 + clamp(f(pr), -.1, 1.15) * gs, y0 + 19 * S + 7, 5 * S + 2);
  ctx.font = `700 ${9 * S + 4}px ${MONO}`; ctx.textBaseline = 'top';
  ctx.fillText(word.css, x0, y0 + 34 * S + 12);
  ctx.restore();
}
function scene3(t) {
  const lt0 = t - S3, k = Math.min(3, Math.floor(lt0 / WD)), lt = lt0 - k * WD;
  const cur = WORDS[k], prev = k > 0 ? WORDS[k - 1] : { bg: '#0c0c14' };
  bg(prev.bg);
  ctx.fillStyle = cur.bg; circle(CX, CY, E.outExpo(seg(lt, 0, .38)) * DIAG * .6);
  const fs = Math.min(W * .16, H * .28);
  ctx.font = `900 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // echo outlines drifting in opposite directions
  const ea = seg(lt, .08, .3) * (1 - seg(lt, .55, .74));
  ctx.strokeStyle = cur.fg; ctx.lineWidth = 2 * S + .5;
  for (const e of [-1, 1]) for (const m of [1, 2]) {
    ctx.globalAlpha = ea * (m === 1 ? .22 : .09);
    ctx.strokeText(cur.w, CX + e * (lt * W * .12 + 20 * S) * m * (k % 2 ? -1 : 1), CY + e * fs * .98 * m);
  }
  ctx.globalAlpha = 1;
  // letters: staggered masked slide with squash & stretch
  const chars = [...cur.w], ws = chars.map(ch => ctx.measureText(ch).width), tw = ws.reduce((s, v) => s + v, 0);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, CY - fs * .6, W, fs * 1.2); ctx.clip();
  ctx.fillStyle = cur.fg;
  let x = CX - tw / 2;
  chars.forEach((ch, i) => {
    const ip = E.outExpo(seg(lt, .02 + i * .035, .36 + i * .035));
    const op = E.inExpo(seg(lt, .54 + i * .022, .72 + i * .022));
    const y = CY + (1 - ip) * fs * 1.15 - op * fs * 1.15;
    const st = 1 + (1 - ip) * .7 + op * .7;
    ctx.save(); ctx.translate(x + ws[i] / 2, y); ctx.scale(1 / Math.sqrt(st), st);
    ctx.fillText(ch, 0, 0); ctx.restore();
    x += ws[i];
  });
  ctx.restore();
  // beat counter
  ctx.fillStyle = cur.fg; ctx.font = `700 ${11 * S + 4}px ${MONO}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const bx = 40 * S + 24, by = H - 40 * S - 30;
  for (let b = 0; b < 4; b++) { ctx.globalAlpha = b === k ? 1 : .25; ctx.fillRect(bx + b * 22 * S + b * 6, by, 16 * S + 4, 16 * S + 4); }
  ctx.globalAlpha = 1;
  easeGraph(cur, lt);
  label('02', 'TYPE', t, 5.25, 8.1, cur.fg);
  // impact burst from the scene-2 collapse
  const bp = seg(t, 5.2, 5.6);
  if (bp < 1) {
    ctx.lineCap = 'round';
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * TAU, r0 = E.outExpo(bp) * 260 * S, r1 = r0 + (1 - bp) * 120 * S;
      ctx.strokeStyle = i % 2 ? C.ink : '#fff'; ctx.lineWidth = (1 - bp) * 8 * S;
      ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0); ctx.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1); ctx.stroke();
    }
  }
}

/* ---------- SCENE 4 · 3D point cloud morph → warp (8.16 – 11.2s) ---------- */
function scene4(t) {
  bg('#05050a');
  const lt = t - 8.16;
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, DIAG * .5);
  g.addColorStop(0, 'rgba(123,92,255,.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const m1 = E.inOutCubic(seg(t, 8.95, 9.6)), m2 = E.inOutCubic(seg(t, 9.85, 10.45));
  const warp = E.inExpo(seg(t, 10.55, 11.2));
  const ry = lt * 1.1 + m1 * 1.4 + m2 * 1.8, rx = .35 + Math.sin(lt * 1.4) * .28 + m2 * .25;
  const cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
  const sc = Math.min(W, H) * .3, f = 3.2;
  // orbit rings
  const ra = E.outExpo(seg(lt, .2, .8)) * (1 - warp);
  if (ra > 0) {
    ctx.lineWidth = 1; ctx.strokeStyle = `rgba(255,255,255,${.25 * ra})`;
    for (let r = 0; r < 2; r++) {
      ctx.beginPath();
      ctx.ellipse(CX, CY, sc * (1.55 + r * .3) * ra, sc * (1.55 + r * .3) * ra * Math.abs(Math.sin(rx + r * .6)) + 1, r ? -.4 : .3, 0, TAU);
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (let c = 0; c < 4; c++) {
    ctx.fillStyle = ctx.strokeStyle = PAL[c];
    for (let i = c; i < N3; i += 4) {
      const ap = E.outBack(seg(lt, (i / N3) * .45, (i / N3) * .45 + .5));
      if (ap <= 0) continue;
      let x = lerp(lerp(SPH[i][0], TOR[i][0], m1), HEL[i][0], m2) * ap;
      let y = lerp(lerp(SPH[i][1], TOR[i][1], m1), HEL[i][1], m2) * ap;
      let z = lerp(lerp(SPH[i][2], TOR[i][2], m1), HEL[i][2], m2) * ap;
      const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
      const y1 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
      const spread = 1 + warp * 2.2;
      const zz = z2 + f - warp * 4.6;
      if (zz < .08) continue;
      const px = CX + x1 * spread / zz * f * sc, py = CY + y1 * spread / zz * f * sc;
      const sz = (2.3 * S + .8) * f / zz;
      ctx.globalAlpha = clamp(1.35 - (zz - f + 1.2) * .45, .12, 1);
      if (warp > .02) {
        const zb = zz + .35 * warp;
        ctx.lineWidth = sz * 1.4;
        ctx.beginPath(); ctx.moveTo(CX + x1 * spread / zb * f * sc, CY + y1 * spread / zb * f * sc); ctx.lineTo(px, py); ctx.stroke();
      } else ctx.fillRect(px - sz / 2, py - sz / 2, sz, sz);
    }
  }
  ctx.globalAlpha = 1;
  // hyperspace speed lines
  const sl = seg(t, 10.45, 11.2);
  if (sl > 0) {
    for (const s of SPEED) {
      const ph = (s.o + lt * 2.6) % 1, r0 = lerp(40 * S, DIAG * .55, ph * ph), len = E.inExpo(sl) * DIAG * .28 * ph + 4;
      ctx.strokeStyle = s.c; ctx.globalAlpha = sl * ph; ctx.lineWidth = s.w * S * 2;
      ctx.beginPath(); ctx.moveTo(CX + Math.cos(s.a) * r0, CY + Math.sin(s.a) * r0);
      ctx.lineTo(CX + Math.cos(s.a) * (r0 + len), CY + Math.sin(s.a) * (r0 + len)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';
  // shape name readout
  const names = ['SPHERE', 'TORUS', 'HELIX'];
  const ni = m2 > .5 ? 2 : m1 > .5 ? 1 : 0;
  ctx.globalAlpha = seg(lt, .3, .7) * (1 - warp);
  ctx.fillStyle = '#fff'; ctx.font = `700 ${11 * S + 4}px ${MONO}`; ctx.textBaseline = 'middle';
  spaced(`${names[ni]} · ${N3} PTS · RY ${(ry % TAU).toFixed(2)}`, W - 40 * S - 24, H - 40 * S - 30, 3 * S, 'right');
  ctx.globalAlpha = 1;
  label('03', 'DEPTH', t, 8.3, 10.9);
}

/* ---------- SCENE 5 · Data / infographics (11.2 – 13.25s, iris out until 13.7) ---------- */
function scene5(t) {
  bg(C.paper);
  const items = [{ v: 15, from: 0, l: 'SECONDS', c: C.pink }, { v: 60, from: 0, l: 'FPS', c: C.vio }, { v: 0, from: 100, l: 'LIBRARIES', c: C.cyan }];
  const R = Math.min(W * .1, H * .17), gap = Math.min(W * .29, R * 3.2);
  items.forEach((it, k) => {
    const en = E.outExpo(seg(t, 11.3 + k * .1, 11.9 + k * .1));
    const ex = E.inExpo(seg(t, 12.95 + k * .06, 13.3 + k * .06));
    const x = CX + (k - 1) * gap, y = CY - 30 * S + (1 - en) * H * .45 - ex * H * .6;
    const pp = E.inOutCubic(seg(t, 11.4 + k * .1, 12.45 + k * .1));
    ctx.save(); ctx.translate(x, y);
    // dashed rotating outer ring
    ctx.strokeStyle = 'rgba(11,11,18,.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 7]);
    ctx.beginPath(); ctx.arc(0, 0, R * 1.22, t * (k % 2 ? -1 : 1), t * (k % 2 ? -1 : 1) + TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth = 12 * S + 2; ctx.strokeStyle = 'rgba(11,11,18,.08)';
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
    ctx.strokeStyle = it.c; ctx.lineCap = 'round';
    const a0 = -Math.PI / 2, a1 = a0 + TAU * pp * .999;
    if (pp > 0) { ctx.beginPath(); ctx.arc(0, 0, R, a0, a1); ctx.stroke(); }
    ctx.fillStyle = C.ink; circle(Math.cos(a1) * R, Math.sin(a1) * R, (5 * S + 2) * seg(pp, 0, .05));
    const val = Math.round(lerp(it.from, it.v, pp));
    ctx.font = `900 ${R * .78}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(val), 0, R * .04);
    ctx.font = `700 ${10 * S + 5}px ${MONO}`;
    spaced(it.l, 0, R * 1.62, 4 * S);
    ctx.restore();
  });
  // typed tagline
  const tag = 'ONE FILE · PURE CANVAS · ZERO DEPENDENCIES';
  const n = Math.floor(seg(t, 12.1, 12.75) * tag.length);
  const ta = 1 - seg(t, 13.0, 13.25);
  if (n > 0 && ta > 0) {
    ctx.globalAlpha = ta; ctx.fillStyle = C.ink; ctx.font = `700 ${12 * S + 5}px ${MONO}`; ctx.textBaseline = 'middle';
    const w = spaced(tag.slice(0, n) + (Math.floor(t * 8) % 2 ? '▌' : ' '), CX, CY + R * 2.25, 3 * S);
    ctx.globalAlpha = 1;
  }
  label('04', 'DATA', t, 11.35, 13.2, C.ink);
}

/* ---------- SCENE 6 · Logo resolve / end card (13.25 – 15s) ---------- */
function scene6(t) {
  bg(C.bg);
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, DIAG * .45);
  g.addColorStop(0, 'rgba(255,46,99,.16)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const fs = Math.min(W * .07, H * .1);
  const up = E.inOutExpo(seg(t, 13.72, 14.08));
  const ly = CY - up * fs * 1.1;
  // logo: three nested rounded diamonds
  [[C.pink, 74], [C.yel, 50], [C.cyan, 26]].forEach(([col, s], k) => {
    const p = seg(t, 13.42 + k * .08, 13.9 + k * .08);
    if (p <= 0) return;
    const sz = s * S * E.outBack(p) * (1 - up * .25);
    const rot = -Math.PI * (1 - E.outExpo(p)) + Math.PI / 4 + (k === 1 ? (t - 13.4) * 1.2 : 0);
    ctx.save(); ctx.translate(CX, ly); ctx.rotate(rot);
    ctx.fillStyle = col; roundRect(-sz, -sz, sz * 2, sz * 2, sz * .28); ctx.fill();
    ctx.restore();
  });
  // ring pulse on logo landing
  const rp = seg(t, 13.6, 14.1);
  if (rp > 0 && rp < 1) { ctx.strokeStyle = `rgba(255,255,255,${1 - rp})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(CX, ly, 80 * S + E.outExpo(rp) * 140 * S, 0, TAU); ctx.stroke(); }
  // title letters
  const title = 'MOTION DESIGNER';
  ctx.font = `900 ${fs}px ${FONT}`; ctx.textBaseline = 'middle';
  const chars = [...title], sp = fs * .04;
  const ws = chars.map(ch => ctx.measureText(ch).width), tw = ws.reduce((s, v) => s + v + sp, -sp);
  const ty = CY + fs * .75;
  let x = CX - tw / 2;
  chars.forEach((ch, i) => {
    const p = seg(t, 13.8 + i * .022, 14.2 + i * .022);
    if (p > 0) {
      ctx.save(); ctx.globalAlpha = p;
      ctx.translate(x + ws[i] / 2, ty + (1 - E.outBack(p)) * fs * .7);
      ctx.rotate((1 - E.outBack(p)) * .5);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(ch, 0, 0);
      ctx.restore();
    }
    x += ws[i] + sp;
  });
  // gradient underline
  const ul = E.inOutExpo(seg(t, 14.05, 14.45));
  if (ul > 0) {
    const lg = ctx.createLinearGradient(CX - tw / 2, 0, CX + tw / 2, 0);
    PAL.forEach((c, i) => lg.addColorStop(i / 3, c));
    ctx.fillStyle = lg; ctx.fillRect(CX - tw / 2 * ul, ty + fs * .62, tw * ul, 4 * S + 1);
  }
  const sa = E.outCubic(seg(t, 14.2, 14.5));
  ctx.globalAlpha = sa; ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.font = `700 ${11 * S + 5}px ${MONO}`;
  spaced('SHOWREEL 2026  ·  AVAILABLE FOR HIRE  →', CX, ty + fs * 1.15 + (1 - sa) * 12 * S, 4 * S);
  ctx.globalAlpha = 1;
  // fade out for a seamless loop
  const fo = seg(t, 14.78, 15);
  if (fo > 0) { ctx.fillStyle = `rgba(7,7,12,${fo})`; ctx.fillRect(-60, -60, W + 120, H + 120); }
}

/* ---------- overlays: camera shake, grain, vignette, HUD ---------- */
const IMPULSES = [[.6, 16], [5.2, 12], [11.2, 14], [13.55, 5]];
function shake(t) {
  let x = 0, y = 0;
  for (const [ti, a] of IMPULSES) {
    const d = t - ti; if (d < 0 || d > .6) continue;
    const k = a * S * Math.exp(-d * 9);
    x += Math.sin(d * 83) * k; y += Math.cos(d * 67) * k;
  }
  return [x, y];
}
const SCENES = [[0, 'BIG BANG'], [3.09, 'FORM'], [5.2, 'TYPE'], [8.16, 'DEPTH'], [11.2, 'DATA'], [13.25, 'END CARD']];
function hud(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'difference';
  ctx.strokeStyle = ctx.fillStyle = 'rgba(255,255,255,.75)';
  const m = 24, L = 22 * S + 8;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, a, b]) => {
    ctx.moveTo(x, y + b * L); ctx.lineTo(x, y); ctx.lineTo(x + a * L, y);
  });
  ctx.stroke();
  ctx.font = `600 ${9 * S + 5}px ${MONO}`; ctx.textBaseline = 'middle';
  const fr = Math.floor(t * 30), ss = Math.floor(fr / 30), ff = fr % 30;
  spaced(`TC 00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`, m + 14, m + 14, 2, 'left');
  let si = 0; SCENES.forEach(([s], i) => { if (t >= s) si = i; });
  spaced(`SCENE 0${si + 1}/06 · ${SCENES[si][1]}`, W - m - 14, m + 14, 2, 'right');
  if (Math.floor(t * 2) % 2 === 0) { ctx.fillStyle = '#ff2e63'; circle(W - m - 14, H - m - 30, 4); }
  ctx.restore();
}

/* ---------- main render ---------- */
function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center'; ctx.lineCap = 'butt';
  const [sx, sy] = shake(t);
  ctx.save(); ctx.translate(sx, sy);
  if (t < 3.09) scene1(t);
  else if (t < 5.2) scene2(t);
  else if (t < 8.16) scene3(t);
  else if (t < 11.2) scene4(t);
  else if (t < 13.25) scene5(t);
  else {
    const ir = E.inOutExpo(seg(t, 13.25, 13.7)) * DIAG * .55;
    if (ir < DIAG * .55) scene5(t);
    ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, Math.max(ir, .01), 0, TAU); ctx.clip();
    scene6(t); ctx.restore();
  }
  if (t > 2.55 && t < 3.5) wipe(t);
  const fl = 1 - seg(t, 11.2, 11.45);
  if (t >= 11.2 && fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl})`; ctx.fillRect(-60, -60, W + 120, H + 120); }
  ctx.restore();
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(-Math.random() * 220, -Math.random() * 220);
  ctx.fillStyle = grain; ctx.fillRect(0, 0, W + 220, H + 220); ctx.restore();
  hud(t);
  bar.style.width = (t / DUR * 100) + '%';
}

/* ---------- playback ---------- */
const params = new URLSearchParams(location.search);
const frozen = params.has('t') ? clamp(parseFloat(params.get('t')) || 0, 0, DUR - .001) : null;
let playhead = frozen ?? 0, paused = frozen !== null, last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) playhead = (playhead + dt) % DUR;
  render(playhead);
  requestAnimationFrame(loop);
}
addEventListener('resize', resize);
addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  if (e.code === 'ArrowRight') playhead = Math.min(DUR - .001, playhead + .5);
  if (e.code === 'ArrowLeft') playhead = Math.max(0, playhead - .5);
});
cv.addEventListener('click', () => { playhead = 0; paused = false; });
resize();
requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
</body>
